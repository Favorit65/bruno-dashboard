name: Update Bruno data

# Раз в день обновляет data.json из Bruno API и коммитит его в репозиторий.
# Первый запуск делаем ВРУЧНУЮ в режиме dry_run=true — только проверка связи и токена,
# без выгрузки и коммита. Это подтверждает, что раннер GitHub достаёт до api.brunosystem.ru.

on:
  schedule:
    # 21:00 UTC = 04:00 по Новосибирску (UTC+7). Минуты/часы можно поменять.
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Только проверка токена и связи (без выгрузки и коммита)'
        type: boolean
        default: false
      date_from:
        description: 'Начало периода YYYY-MM-DD'
        type: string
        default: '2025-01-01'

# Разрешаем боту коммитить обратно в репозиторий.
permissions:
  contents: write

# Чтобы параллельные запуски не мешали друг другу.
concurrency:
  group: update-bruno-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests

      - name: Extract data
        env:
          BRUNO_TOKEN: ${{ secrets.BRUNO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${BRUNO_TOKEN:-}" ]; then
            echo "::error::Секрет BRUNO_TOKEN не задан. Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          FROM="${{ inputs.date_from }}"
          FROM="${FROM:-2025-01-01}"
          TO="$(date -u +%Y-%m-%d)"
          echo "Период: $FROM .. $TO"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "== DRY RUN: только health-check =="
            python extract.py --token "$BRUNO_TOKEN" --from "$FROM" --to "$TO" --dry-run
          else
            python extract.py --token "$BRUNO_TOKEN" --from "$FROM" --to "$TO" --out data.json
          fi

      - name: Commit data.json
        if: ${{ inputs.dry_run != true }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "Изменений в data.json нет — коммит не нужен."
          else
            git commit -m "data: автообновление $(date -u +%F)"
            git push
          fi
