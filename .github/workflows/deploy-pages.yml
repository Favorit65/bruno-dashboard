name: Публикация дашборда (GitHub Pages)

# Собирает сайт из трёх источников:
#   main         -> index.html, dashboard_v2.html и прочая статика
#   data-model   -> свежий model.json.gz (кладёт робот update-model.yml)
#   main         -> data.json.gz для старого дашборда v3 (пока он жив)
# Запускается: при правке HTML в main, вручную кнопкой Run workflow и
# как подпрограмма (workflow_call) из «Обновление данных (архив + модель)».

on:
  push:
    branches: [ main ]
    paths:
      - '**.html'
      - '.nojekyll'
      - '.github/workflows/deploy-pages.yml'
  # Вызывается напрямую как подпрограмма из update-model.yml
  # (раньше здесь был workflow_run — он ни разу не сработал, см. README).
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Код проекта (main)
        uses: actions/checkout@v4

      - name: Свежая модель (ветка data-model)
        id: model
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: data-model
          path: _model
          fetch-depth: 1

      - name: Собрать содержимое сайта
        run: |
          mkdir -p site
          cp .nojekyll site/ 2>/dev/null || touch site/.nojekyll
          cp index.html site/
          cp dashboard_v2.html site/
          # старый дашборд v3 и его данные — пока не выведен из эксплуатации
          cp dashboard_vtb_live_3.html site/ 2>/dev/null || true
          cp data.json.gz site/ 2>/dev/null || true
          if [ -f _model/model.json.gz ]; then
            cp _model/model.json.gz site/
            # формат 2: сайт грузит core сразу, cubes догружает фоном
            cp _model/model.core.json.gz _model/model.cubes.json.gz site/ 2>/dev/null || \
              echo "::warning::В ветке data-model нет файлов формата 2 — дашборд откатится на model.json.gz. Перезапустите «Обновление данных»."
          else
            echo "::warning::Ветка data-model пуста — сайт уедет без свежей модели. Запустите workflow «Обновление данных»."
          fi
          ls -lh site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Итог
        run: |
          {
            echo "### Сайт опубликован"
            echo ""
            echo "- Адрес: ${{ steps.deployment.outputs.page_url }}"
            echo "- Модель (формат 1): $( [ -f site/model.json.gz ] && du -h site/model.json.gz | cut -f1 || echo 'НЕ ПРИЛОЖЕНА' )"
            echo "- Первый экран (core): $( [ -f site/model.core.json.gz ] && du -h site/model.core.json.gz | cut -f1 || echo 'НЕТ' )"
            echo "- Догрузка (cubes): $( [ -f site/model.cubes.json.gz ] && du -h site/model.cubes.json.gz | cut -f1 || echo 'НЕТ' )"
          } >> "$GITHUB_STEP_SUMMARY"
