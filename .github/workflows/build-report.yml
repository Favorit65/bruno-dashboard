name: Отчёт-презентация (PPTX)

# Кнопка «собрать отчёт»: Actions -> этот workflow -> Run workflow ->
# выбрать период -> через пару минут скачать .pptx из раздела Artifacts.
# Данные берутся из готовой модели (ветка data-model), в Bruno API не ходим —
# поэтому сборка быстрая и не грузит систему.

on:
  workflow_dispatch:
    inputs:
      copy_deck:
        description: 'Копия утверждённой колоды (21 слайд, горизонт 4 месяца)'
        type: boolean
        default: true
      clean_roles:
        description: 'Кого считать уборщицами в копии колоды'
        type: choice
        default: 'split'
        options:
          - split       # плановые — роль уборщиц, неплановые — плюс «Менеджер клининга» (согласовано 22.08.2026)
          - base        # только системная роль employee — как в утверждённой колоде
          - base+mgr    # обе роли и в плановых, и в неплановых
      own_deck:
        description: 'Также собрать разработанный отчёт (7 слайдов)'
        type: boolean
        default: false
      preset:
        description: 'Период разработанного отчёта (на копию НЕ влияет)'
        type: choice
        default: 'this-month'
        options:
          - this-month
          - last-month
          - last-30
          - last-90
          - ytd
          - all
          - custom
      date_from:
        description: 'Только для custom: начало, ГГГГ-ММ-ДД'
        required: false
        type: string
      date_to:
        description: 'Только для custom: конец, ГГГГ-ММ-ДД'
        required: false
        type: string
      title:
        description: 'Заголовок титульного слайда разработанного отчёта'
        required: false
        default: 'Отчёт по эксплуатации объектов'
        type: string
      pdf:
        description: 'Дополнительно сделать PDF'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: bruno-report-${{ github.actor }}
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Обе галочки сняты — собирать нечего. Без этой проверки прогон падал бы
      # в конце на upload-artifact с невнятным «no files found».
      - name: Проверка входов
        if: ${{ !inputs.copy_deck && !inputs.own_deck }}
        run: |
          echo "::error::Обе галочки сняты — собирать нечего. Включите копию утверждённой колоды или разработанный отчёт."
          exit 1

      - name: Код проекта (main)
        uses: actions/checkout@v4

      - name: Модель данных (ветка data-model)
        uses: actions/checkout@v4
        with:
          ref: data-model
          path: _model
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Зависимости
        run: pip install -r requirements-report.txt

      - name: Собрать разработанный отчёт (7 слайдов)
        id: build
        if: ${{ inputs.own_deck }}
        env:
          IN_PRESET: ${{ inputs.preset }}
          IN_FROM: ${{ inputs.date_from }}
          IN_TO: ${{ inputs.date_to }}
          IN_TITLE: ${{ inputs.title }}
        run: |
          set -e
          if [ "$IN_PRESET" = "custom" ]; then
            if [ -z "$IN_FROM" ] || [ -z "$IN_TO" ]; then
              echo "::error::Выбран период custom, но даты не заполнены — укажите date_from и date_to."
              exit 1
            fi
            ARGS="--from $IN_FROM --to $IN_TO"
            NAME="${IN_FROM}_${IN_TO}"
          else
            ARGS="--preset $IN_PRESET"
            NAME="$IN_PRESET"
          fi
          OUT="Bruno_report_${NAME}.pptx"
          python build_report.py \
            --model _model/model.json.gz \
            $ARGS \
            --title "$IN_TITLE" \
            --out "$OUT" | tee build.log
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      # Копия утверждённой руководством колоды (21 слайд). Её период НЕ зависит
      # от выбранного выше пресета: по требованию заказчика горизонт всегда
      # «текущий месяц + 3 предыдущих», а состав приложений — объекты и
      # коменданты, активные в текущем месяце.
      - name: Собрать копию утверждённой колоды
        id: copy
        if: ${{ inputs.copy_deck }}
        env:
          IN_CLEAN: ${{ inputs.clean_roles }}
        run: |
          set -e
          OUT="Bruno_report_approved_$(date +%Y-%m-%d).pptx"
          python build_report_v5.py \
            --model _model/model.json.gz \
            --clean "$IN_CLEAN" \
            --out "$OUT" | tee copy.log
          echo "out=$OUT" >> "$GITHUB_OUTPUT"

      - name: Разница между вариантами «кто такие уборщицы»
        if: ${{ inputs.copy_deck }}
        run: python report_v5_model.py --model _model/model.json.gz --diff-clean | tee clean_diff.log

      # На ubuntu-latest (с версии 24.04) LibreOffice больше НЕ предустановлен —
      # шаг просто не находил soffice и молча выходил, из-за чего PDF не было,
      # хотя галочка стояла. Теперь ставим пакет сами, если его нет.
      - name: Конвертировать в PDF
        if: ${{ inputs.pdf }}
        run: |
          set -e
          if ! command -v soffice >/dev/null; then
            echo "LibreOffice на раннере нет — ставлю (займёт около минуты)…"
            sudo apt-get update -qq
            sudo apt-get install -y -qq libreoffice-impress fonts-dejavu >/dev/null
          fi
          soffice --version || true
          shopt -s nullglob
          for f in Bruno_report_*.pptx; do
            soffice --headless --convert-to pdf "$f" --outdir . || \
              echo "::warning::Конвертация $f в PDF не удалась, PPTX всё равно готов."
          done
          ls -la *.pdf || echo "::warning::PDF так и не появились."

      - name: Выложить файлы
        uses: actions/upload-artifact@v4
        with:
          name: bruno-report-${{ github.run_number }}
          path: |
            Bruno_report_*.pptx
            Bruno_report_*.pdf
          retention-days: 30
          if-no-files-found: error

      - name: Итог
        run: |
          {
            echo "### Отчёт готов"
            if [ -f build.log ]; then
              echo ""
              echo "#### Разработанный отчёт (7 слайдов)"
              echo ""
              echo '```'
              tail -4 build.log
              echo '```'
            else
              echo ""
              echo "_Разработанный отчёт не собирался — галочка снята._"
            fi
            if [ -f copy.log ]; then
              echo ""
              echo "### Копия утверждённой колоды"
              echo ""
              echo '```'
              tail -8 copy.log
              echo '```'
            fi
            if [ -f clean_diff.log ]; then
              echo ""
              echo "<details><summary>Уборщицы: роль employee vs. + Менеджер клининга</summary>"
              echo ""
              echo '```json'
              cat clean_diff.log
              echo '```'
              echo ""
              echo "</details>"
            fi
            echo ""
            echo "Скачать файлы — в разделе **Artifacts** внизу этой страницы."
          } >> "$GITHUB_STEP_SUMMARY"
