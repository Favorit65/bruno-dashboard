name: "старый конвейер v3 — Build data (aggregates)"

on:
  workflow_dispatch:
    inputs:
      window_days:
        description: 'Окно разрезов/категорий, дней'
        type: string
        default: '30'
  # schedule: отключено 21.08.2026 — ежедневную выгрузку
  # ведёт новый конвейер update-model.yml. Кнопка Run workflow работает.

permissions:
  contents: write

concurrency:
  group: build-bruno-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Build data.json.gz
        env:
          BRUNO_TOKEN: ${{ secrets.BRUNO_TOKEN }}
          WINDOW_DAYS: ${{ inputs.window_days }}
        run: |
          python3 - <<'PY'
          import os, json, gzip, time, requests
          from datetime import datetime, timezone, timedelta
          from urllib.parse import urlencode

          B = "https://api.brunosystem.ru"
          TOK = os.environ.get("BRUNO_TOKEN", "")
          WD = int(os.environ.get("WINDOW_DAYS") or "60")
          H = {"token": TOK, "Accept": "application/json", "User-Agent": "bruno-agg/1.0"}
          S = requests.Session()
          _last = [0.0]

          def rl():
              dt = time.monotonic() - _last[0]
              if dt < 1.1:
                  time.sleep(1.1 - dt)
              _last[0] = time.monotonic()

          def GET(path, params):
              url = B + path + ("?" + urlencode(params) if params else "")
              r = None
              for _ in range(6):
                  rl()
                  r = S.get(url, headers=H, timeout=60)
                  if r.status_code == 429:
                      time.sleep(int(r.headers.get("Retry-After", "5")))
                      continue
                  return r
              return r

          def iso(d):
              return d.strftime("%Y-%m-%dT%H:%M:%S.000Z")

          def daynum(rec):
              dl = rec.get("dateLocal")
              if dl:
                  s = str(dl)
                  return "%s-%s-%s" % (s[0:4], s[4:6], s[6:8])
              return (rec.get("date") or "")[:10]

          now = datetime.now(timezone.utc)
          FULLF = "date ge '2025-01-01T00:00:00.000Z' AND date le '%s'" % iso(now)
          winfrom = now - timedelta(days=WD)
          WINF = "date ge '%s' AND date le '%s'" % (iso(winfrom), iso(now))

          r = GET("/api/v2/apiToken", None)
          pid = None
          if r is not None and r.status_code == 200:
              b = r.json()
              pid = b.get("projectID")
              if not pid and isinstance(b.get("result"), dict):
                  pid = b["result"].get("projectID")
          if pid:
              H["projectid"] = pid
          print("projectID:", pid or "<нет>")

          def fetch_dir(path):
              out, frm = [], 0
              while True:
                  r = GET(path, {"from": frm, "limit": 500})
                  if r is None or r.status_code != 200:
                      print("  ", path, "HTTP", getattr(r, "status_code", "-"))
                      break
                  res = r.json().get("result") or []
                  out += res
                  if len(res) < 500:
                      break
                  frm += 500
              return out

          def fetch_list(path, flt):
              out, frm, page = [], 0, 0
              overall = "?"
              while True:
                  r = GET(path, {"from": frm, "limit": 500, "filter": flt})
                  if r is None or r.status_code != 200:
                      print("  ", path, "HTTP", getattr(r, "status_code", "-"), (r.text[:120] if r is not None else ""))
                      break
                  b = r.json()
                  res = b.get("result") or []
                  overall = b.get("overall")
                  out += res
                  page += 1
                  if page % 20 == 0:
                      print("  %s: %d/%s" % (path, len(out), overall))
                  if len(res) < 500:
                      break
                  frm += 500
              print("  %s: ИТОГО %d/%s" % (path, len(out), overall))
              return out

          def COUNT(flt):
              r = GET("/api/v2/taskPlan", {"from": 0, "limit": 1, "filter": flt})
              if r is None or r.status_code != 200:
                  print("  count HTTP", getattr(r, "status_code", "-"), (r.text[:100] if r is not None else ""))
                  return None
              return r.json().get("overall")

          def bydays(path):
              r = GET(path, {"filter": FULLF})
              if r is None or r.status_code != 200:
                  print("  ", path, "HTTP", getattr(r, "status_code", "-"))
                  return {}
              return r.json().get("result") or {}

          def uid(x):
              return str(x.get("id") or x.get("uuid") or x.get("_id") or "")

          def uname(u):
              return u.get("name") or " ".join([p for p in [u.get("lastName"), u.get("firstName")] if p]) or u.get("login") or ""

          print("Справочники…")
          obj = fetch_dir("/api/v2/object")
          zone = fetch_dir("/api/v2/zone")
          user = fetch_dir("/api/v2/user")
          team = fetch_dir("/api/v2/team")

          directories = {
              "object": [{"id": uid(o), "name": o.get("name") or "", "address": o.get("address")}
                         for o in obj if not o.get("deleted")],
              "zone": [{"id": uid(z), "objectID": str(z.get("objectID") or ""), "name": z.get("name") or ""}
                       for z in zone if not z.get("deleted")],
              "user": [{"id": uid(u), "name": uname(u)} for u in user if not u.get("deleted")],
              "team": [{"id": uid(t), "name": t.get("name") or ""} for t in team if not t.get("deleted")],
              "workType": [],
          }

          print("byDays (вся история)…")
          daily = {
              "zone": bydays("/api/v2/statByZone/byDays"),
              "employee": bydays("/api/v2/statByEmployee/byDays"),
              "team": bydays("/api/v2/statByTeam/byDays"),
          }

          print("Списки statBy* за %d дней (сворачиваем в суммы)…" % WD)
          sz = fetch_list("/api/v2/statByZone", WINF)
          se = fetch_list("/api/v2/statByEmployee", WINF)
          st = fetch_list("/api/v2/statByTeam", WINF)

          def agg(rows, key):
              out = {}
              for r in rows:
                  k = str(r.get(key) or "")
                  if not k:
                      continue
                  a = out.get(k)
                  if a is None:
                      a = out[k] = {"c": 0, "m": 0, "w": 0}
                  a["c"] += r.get("completedTasksCount", 0) or 0
                  a["m"] += r.get("missedTasksCount", 0) or 0
                  a["w"] += r.get("warningsTasksCount", 0) or 0
              return out

          by_object = agg(sz, "objectID")
          by_zone = agg(sz, "zoneID")
          by_employee = agg(se, "employeeID")
          by_team = agg(st, "teamID")

          print("Категории задач за %d дней…" % WD)

          def detect_notnull():
              cands = ["%s ne null", "%s ne ''", "%s gt ''", "%s not null"]
              for c in cands:
                  expr = (c % "feedbackID") + " AND " + WINF
                  r = GET("/api/v2/taskPlan", {"from": 0, "limit": 1, "filter": expr})
                  code = getattr(r, "status_code", "-")
                  print("  проба not-null '%s' -> HTTP %s" % (c % "feedbackID", code))
                  if r is not None and code == 200:
                      return c
              return None

          def cst(rows, s):
              return sum(1 for x in rows if x["s"] == s)

          nn = detect_notnull()
          feedback_rows = []
          categories = {
              "windowDays": WD,
              "windowFrom": winfrom.strftime("%Y-%m-%d"),
              "windowTo": now.strftime("%Y-%m-%d"),
              "syntaxOk": bool(nn),
              "total":    {"all": COUNT(WINF)},
              "feedback": {"all": 0, "completed": 0, "missed": 0},
              "planned":  {"all": None, "completed": None, "missed": None},
          }
          if nn:
              print("Рабочий синтаксис: '%s'. Обращения (детально)…" % (nn % "<поле>"))
              FB = (nn % "feedbackID") + " AND " + WINF
              TT = (nn % "taskTemplateID") + " AND " + WINF
              fbtasks = fetch_list("/api/v2/taskPlan", FB)
              feedback_rows = [{"d": daynum(r), "o": str(r.get("objectID") or ""), "z": str(r.get("zoneID") or ""),
                                "s": (r.get("status") or "").upper(), "e": str(r.get("employeeID") or ""),
                                "t": str(r.get("teamID") or "")} for r in fbtasks]
              categories["feedback"] = {"all": len(feedback_rows),
                                        "completed": cst(feedback_rows, "COMPLETED"),
                                        "missed": cst(feedback_rows, "MISSED")}
              categories["planned"] = {"all": COUNT(TT),
                                       "completed": COUNT(TT + " AND status eq 'COMPLETED'"),
                                       "missed": COUNT(TT + " AND status eq 'MISSED'")}
          else:
              print("  Синтаксис not-null не подобран — категории пропущены, нужен точный фильтр от Bruno.")

          # ---- Регулярные (плановые, taskTemplate) задачи ПО ДНЯМ за всю историю ----
          # Нужны для блока «план–факт»: план = число плановых задач со сроком в дне,
          # факт = выполнено в срок (COMPLETED), просрочено = MISSED. Обращения (feedbackID)
          # в этот срез НЕ входят — только регулярные задачи (taskTemplateID ne null).
          planned_daily = {}
          if nn:
              print("Плановые (taskTemplate) по дням за всю историю…")
              PLAN_FULL = (nn % "taskTemplateID") + " AND " + FULLF
              plan_rows = fetch_list("/api/v2/taskPlan", PLAN_FULL)
              for r in plan_rows:
                  day = daynum(r)
                  if not day:
                      continue
                  stt = (r.get("status") or "").upper()
                  b = planned_daily.get(day)
                  if b is None:
                      b = planned_daily[day] = {"allTasksCount": 0, "completedTasksCount": 0, "missedTasksCount": 0}
                  b["allTasksCount"] += 1
                  if stt == "COMPLETED":
                      b["completedTasksCount"] += 1
                  elif stt == "MISSED":
                      b["missedTasksCount"] += 1
          daily["planned"] = planned_daily

          data = {
              "meta": {
                  "extractedAt": iso(now), "projectID": pid, "source": "bruno-aggregates",
                  "historyFrom": "2025-01-01", "historyTo": now.strftime("%Y-%m-%d"),
                  "windowDays": WD, "windowFrom": winfrom.strftime("%Y-%m-%d"),
                  "windowTo": now.strftime("%Y-%m-%d"), "workTypeAvailable": False,
              },
              "directories": directories,
              "daily": daily,
              "window": {
                  "byObject": by_object, "byZone": by_zone,
                  "byEmployee": by_employee, "byTeam": by_team,
                  "feedbackTasks": feedback_rows,
              },
              "categories": categories,
          }

          with gzip.open("data.json.gz", "wt", encoding="utf-8", compresslevel=6) as f:
              json.dump(data, f, ensure_ascii=False, default=str)

          size = os.path.getsize("data.json.gz") / 1024
          print("=" * 62)
          print("Справочники: object=%d zone=%d user=%d team=%d" % (
              len(directories["object"]), len(directories["zone"]),
              len(directories["user"]), len(directories["team"])))
          print("byDays дней: zone=%d employee=%d team=%d planned=%d" % (
              len(daily["zone"]), len(daily["employee"]), len(daily["team"]), len(daily["planned"])))
          print("Свёрнуто сущностей: объектов=%d зон=%d сотрудников=%d команд=%d" % (
              len(by_object), len(by_zone), len(by_employee), len(by_team)))
          print("Категории(%d дн): всего=%s" % (WD, categories["total"]["all"]))
          print("  обращения:  all=%s completed=%s missed=%s (строк=%d)" % (
              categories["feedback"]["all"], categories["feedback"]["completed"],
              categories["feedback"]["missed"], len(feedback_rows)))
          print("  плановые:   all=%s completed=%s missed=%s" % (
              categories["planned"]["all"], categories["planned"]["completed"],
              categories["planned"]["missed"]))
          print("data.json.gz = %.1f КБ" % size)
          print("=" * 62)
          PY

      - name: Commit data.json.gz
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json.gz
          if git diff --staged --quiet; then
            echo "Изменений нет."
          else
            git commit -m "data(agg): обновление $(date -u +%F)"
            git push
          fi
